# Spring Application
spring.application.name=McpServerDemo

# MCP Server 設定
spring.ai.mcp.server.name=mcp-server-demo
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.stdio=true

# 關閉 Spring Boot Banner（避免 STDIO 干擾）
spring.main.banner-mode=off

# 設定日誌輸出到檔案（避免 STDIO 干擾）
logging.pattern.console=%n
logging.file.name=logs/mcp-server.log
logging.level.root=INFO
logging.level.com.rex.mcpserverdemo=DEBUG

# ========== MySQL 資料庫設定 ==========
spring.datasource.url=jdbc:mysql://localhost:3306/mcp_db?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA/Hibernate 設定 ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
