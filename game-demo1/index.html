<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPG 移動小遊戲</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    #gameWrap { height: 100vh; display: flex; align-items: center; justify-content: center; }
    #canvas { image-rendering: pixelated; background: #1e293b; border: 4px solid #94a3b8; }
    .hint { position: fixed; bottom: 12px; left: 12px; opacity: .9; }
  </style>
</head>
<body>
  <div id="gameWrap" class="container">
    <div class="text-center">
      <h1 class="mb-3">RPG 移動小遊戲</h1>
      <canvas id="canvas" width="512" height="512" class="rounded"></canvas>
      <div class="hint text-secondary">使用方向鍵 ← ↑ → ↓ 移動角色</div>
    </div>
  </div>

  <script src="./js/game.js"></script>
</body>
</html>
