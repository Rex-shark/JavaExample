spring.application.name=LinebotDemo
server.port=8080


#line
line.bot.channel-token=
line.bot.channel-secret=
line.bot.handler.enabled=true
line.bot.handler.path=/callback

#AI
ai.gemini.api-key=

#RAG (knowledge base)
ai.rag.enabled=true
# classpath dir: src/main/resources/knowledge
ai.rag.knowledge-classpath-dir=knowledge
# retrieval params
ai.rag.top-k=4
ai.rag.min-score=0.08
ai.rag.max-context-chars=4000
# when RAG has no match, return this message directly (skip Gemini call)
ai.rag.fallback-message=??????????

##test
#test.test-name = Url
#test.test-url = url123
