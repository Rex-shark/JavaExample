# ============================================
# 應用程式設定
# ============================================
spring.application.name=SpecDemo

# ============================================
# 資料庫設定
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/shopdb?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate 設定
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# JWT 設定
# ============================================
# 密鑰（生產環境請使用環境變數或外部配置）
jwt.secret=YourSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLong123456
# Token 過期時間（毫秒），預設 24 小時
jwt.expiration=86400000

# ============================================
# Swagger / OpenAPI 設定
# ============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# 日誌設定
# ============================================
logging.level.com.rex.specdemo=DEBUG
logging.level.org.springframework.security=DEBUG
