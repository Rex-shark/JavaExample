# File: nginx.conf
# 放在 vue_demo1/nginx.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 選用：避免 index.html 被快取，便於部署新版本時生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}

# Build & Run (在 vue_demo1 目錄執行)
# docker build -t vue_demo1:latest .
# docker run -p 8080:80 vue_demo1:latest