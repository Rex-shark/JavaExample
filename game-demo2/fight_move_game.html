<!doctype html>
<html class="no-js" lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fight_move_game</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="fight_move_game">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#111">

  <style>
    /* Minimal page styles to center the game area */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0f0f12;
      color: #e6e6e6;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }
    .hud {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .tag { padding: 4px 8px; border-radius: 6px; background: #1d2433; border: 1px solid #2a3347; }
    .ok { color: #9ae6b4; border-color: #2e6b4f; background: #163725; }
    .warn { color: #fbd38d; border-color: #73511d; background: #3b2a12; }
    .err { color: #feb2b2; border-color: #7b2d2d; background: #3a1616; }

    /* Layout: stage + chat side-by-side */
    .main-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 16px;
      width: min(100%, 980px);
      /* Slightly shift whole row to left */
      transform: translateX(-24px);
    }

    /* Game stage */
    .stage-wrap { position: relative; }
    .stage {
      width: min(80vmin, 520px);
      height: min(80vmin, 520px);
      background: #0d1524;
      border: 2px solid #2a3347;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03);
      position: relative;
      overflow: hidden;
    }
    .grid { position:absolute; inset:0; background-image: linear-gradient(#1d243333 1px, transparent 1px), linear-gradient(90deg, #1d243333 1px, transparent 1px); background-size: 40px 40px; }
    .player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 24px;
      margin-left: -12px; /* center by middle point */
      margin-top: -12px;
      background: linear-gradient(135deg, #6ba8ff, #3578ff);
      border: 2px solid #dbe8ff;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(53,120,255,.35);
      transform: translate(0, 0);
      transition: transform 80ms ease-out;
    }

    /* Chat panel */
    .chat {
      width: 300px;
      height: min(80vmin, 520px);
      background: #0d1524;
      border: 2px solid #2a3347;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header { padding: 10px 12px; border-bottom: 1px solid #2a3347; font-weight: 600; background: #101a2b; }
    .chat-body { flex: 1; overflow: auto; padding: 10px 12px; }
    .chat-msg { font-size: 13px; line-height: 1.5; padding: 6px 8px; background:#111a2a; border:1px solid #22314a; border-radius:6px; margin-bottom: 8px; }
    .chat-msg small { opacity: .7; }

    .panel { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; }
    button { background:#1d2433; color:#e6e6e6; border:1px solid #2a3347; padding:8px 12px; border-radius:8px; cursor:pointer; }
    button:hover { filter: brightness(1.1); }
    small.kbd { border:1px solid #2a3347; padding:2px 6px; border-radius:4px; background:#111826; }

    .back {
      margin-top: 8px;
      text-align: center;
    }
    .back a {
      color: #9ecbff;
      text-decoration: none;
    }
    .back a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="page">
    <h1 style="margin:0;font-size:20px">fight_move_game</h1>

    <div class="hud">
      <div id="status" class="tag warn">Connecting...</div>
      <div class="tag">Room: <strong id="roomTag">default</strong></div>
      <div class="tag">WS: <span id="wsUrl">-</span></div>
    </div>

    <div class="main-row">
      <div class="stage-wrap">
        <div class="stage" id="stage">
          <div class="grid"></div>
          <div class="player" id="player" aria-label="player"></div>
        </div>
      </div>

      <aside class="chat" aria-label="Room messages">
        <div class="chat-header">Room Messages</div>
        <div class="chat-body" id="chatBody"></div>
      </aside>
    </div>

    <div class="panel">
      <span>Debug:</span>
      <button data-cmd="up">Up</button>
      <button data-cmd="left">Left</button>
      <button data-cmd="down">Down</button>
      <button data-cmd="right">Right</button>
      <span style="opacity:.8">(Sends GET /move/move2?dir=...&id=ROOM)</span>
    </div>

    <p style="opacity:.85;margin:8px 0 0 0; font-size: 13px; text-align:center;">
      Tips: Use URL ?id=roomA to join a room. Server pushes SocketMessageResponse. Game uses game.type and game.text.
      <br>
      Keyboard: <small class="kbd">↑</small> <small class="kbd">↓</small> <small class="kbd">←</small> <small class="kbd">→</small>
    </p>

    <div class="back"><a href="./">← 回首頁</a></div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
