<!doctype html>
<html class="no-js" lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fight_move_game</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="fight_move_game">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#111">

  <style>
    /* Minimal page styles to center the game area */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0f0f12;
      color: #e6e6e6;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }
    .hud {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .tag { padding: 4px 8px; border-radius: 6px; background: #1d2433; border: 1px solid #2a3347; }
    .ok { color: #9ae6b4; border-color: #2e6b4f; background: #163725; }
    .warn { color: #fbd38d; border-color: #73511d; background: #3b2a12; }
    .err { color: #feb2b2; border-color: #7b2d2d; background: #3a1616; }

    /* Layout: stage + chat side-by-side */
    .main-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 16px;
      width: min(100%, 980px);
      /* Slightly shift whole row to left */
      transform: translateX(-24px);
    }

    /* Game stage */
    .stage-wrap { position: relative; }
    .stage {
      width: min(80vmin, 520px);
      height: min(80vmin, 520px);
      background: #0d1524;
      border: 2px solid #2a3347;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03);
      position: relative;
      overflow: hidden;
    }
    .grid { position:absolute; inset:0; background-image: linear-gradient(#1d243333 1px, transparent 1px), linear-gradient(90deg, #1d243333 1px, transparent 1px); background-size: 40px 40px; }
    .player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 24px;
      margin-left: -12px; /* center by middle point */
      margin-top: -12px;
      background: linear-gradient(135deg, #6ba8ff, #3578ff);
      border: 2px solid #dbe8ff;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(53,120,255,.35);
      transform: translate(0, 0);
      transition: transform 80ms ease-out;
    }

    /* Targets */
    .target {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin-left: -10px;
      margin-top: -10px;
      background: #ffd166;
      border: 2px solid #f7b801;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.45);
    }
    .target--top { background: #ff6b6b; border-color: #ff4d4d; }
    .target--right { background: #6bff95; border-color: #3de477; }
    .target--bottom { background: #9ecbff; border-color: #6ba8ff; }
    .target--left { background: #f9a8d4; border-color: #f472b6; }

    /* Chat panel */
    .chat {
      width: 300px;
      height: min(80vmin, 520px);
      background: #0d1524;
      border: 2px solid #2a3347;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header { padding: 10px 12px; border-bottom: 1px solid #2a3347; font-weight: 600; background: #101a2b; }
    .chat-body { flex: 1; overflow: auto; padding: 10px 12px; }
    .chat-msg { font-size: 13px; line-height: 1.5; padding: 6px 8px; background:#111a2a; border:1px solid #22314a; border-radius:6px; margin-bottom: 8px; }
    .chat-msg small { opacity: .7; }

    .panel { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; }
    button { background:#1d2433; color:#e6e6e6; border:1px solid #2a3347; padding:8px 12px; border-radius:8px; cursor:pointer; }
    button:hover { filter: brightness(1.1); }
    small.kbd { border:1px solid #2a3347; padding:2px 6px; border-radius:4px; background:#111826; }

    .back {
      margin-top: 8px;
      text-align: center;
    }
    .back a {
      color: #9ecbff;
      text-decoration: none;
    }
    .back a:hover {
      text-decoration: underline;
    }

    /* Win overlay */
    .win-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.55);
      z-index: 50;
    }
    .win-box {
      background: #0f172a;
      border: 1px solid #24314a;
      border-radius: 12px;
      padding: 16px 18px;
      width: min(90vw, 380px);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      text-align: center;
    }
    .win-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .win-sub { opacity: .9; margin-bottom: 12px; }
    .win-actions button { background:#1d2433; color:#e6e6e6; border:1px solid #2a3347; padding:8px 12px; border-radius:8px; cursor:pointer; }
    .win-actions button:hover { filter: brightness(1.1); }

    /* Legend for targets and departments */
    .legend { width: min(100%, 980px); margin-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .legend-title { font-size: 14px; opacity: .9; }
    .legend-list { list-style: none; display: flex; gap: 12px; padding: 0; margin: 0; flex-wrap: wrap; justify-content: center; align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 8px; background: #101a2b; border: 1px solid #2a3347; border-radius: 8px; padding: 6px 10px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.45); border: 2px solid currentColor; }
    .legend-dot--top { background: #ff6b6b; color: #ff4d4d; }
    .legend-dot--right { background: #6bff95; color: #3de477; }
    .legend-dot--bottom { background: #9ecbff; color: #6ba8ff; }
    .legend-dot--left { background: #f9a8d4; color: #f472b6; }
    .legend-note { font-size: 12px; opacity: .75; }
  </style>
</head>

<body>
  <div class="page">
    <h1 style="margin:0;font-size:20px">fight_move_game</h1>

    <div class="hud">
      <div id="status" class="tag warn">Connecting...</div>
      <div class="tag">Room: <strong id="roomTag">default</strong></div>
      <div class="tag">WS: <span id="wsUrl">-</span></div>
    </div>

    <div class="main-row">
      <div class="stage-wrap">
        <div class="stage" id="stage">
          <div class="grid"></div>
          <div class="player" id="player" aria-label="player"></div>
          <!-- targets will be injected by JS -->
        </div>
      </div>

      <aside class="chat" aria-label="Room messages">
        <div class="chat-header">Room Messages</div>
        <div class="chat-body" id="chatBody"></div>
      </aside>
    </div>

    <!-- Legend: show target color -> department mapping -->
    <section class="legend" aria-label="目標點對應單位">
      <div class="legend-title">單位</div>
      <ul class="legend-list">
        <li class="legend-item"><span class="legend-dot legend-dot--top" aria-hidden="true"></span><span>智慧軟體處</span></li>
        <li class="legend-item"><span class="legend-dot legend-dot--right" aria-hidden="true"></span><span>產業研發處</span></li>
        <li class="legend-item"><span class="legend-dot legend-dot--bottom" aria-hidden="true"></span><span>營業服務處+總經理室</span></li>
        <li class="legend-item"><span class="legend-dot legend-dot--left" aria-hidden="true"></span><span>創新應用處+研發工程處</span></li>
      </ul>

    </section>

    <div class="back"><a href="./">← 回首頁</a></div>
  </div>

  <!-- Win overlay (hidden by default, shown by JS) -->
  <div id="winOverlay" class="win-overlay" role="dialog" aria-modal="true" aria-labelledby="winTitle" style="display:none"></div>

  <script src="js/app.js"></script>
</body>

</html>
