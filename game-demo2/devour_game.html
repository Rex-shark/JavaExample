<!doctype html>
<html class="no-js" lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devour_game</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#111">

  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #0f0f12; color: #e6e6e6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
    .hud { display:flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; font-size: 14px; }
    .tag { padding: 4px 8px; border-radius: 6px; background: #1d2433; border: 1px solid #2a3347; }
    .ok { color: #9ae6b4; border-color: #2e6b4f; background: #163725; }
    .warn { color: #fbd38d; border-color: #73511d; background: #3b2a12; }
    .err { color: #feb2b2; border-color: #7b2d2d; background: #3a1616; }

    .main-row { display: grid; grid-template-columns: 300px minmax(360px, 640px) 320px; gap: 18px; align-items: start; width: min(100%, 1200px); margin-inline: auto; }

    /* Stage sizing: fit the center column, avoid overflow overlapping side panels */
    .stage { width: 100%; max-width: 640px; aspect-ratio:1/1; box-sizing: border-box; background: #0d1524; border: 2px solid #2a3347; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03); position: relative; overflow: hidden; }
    .grid { position:absolute; inset:0; pointer-events:none; }
    .player { position:absolute; border-radius:50%; border:2px solid #fff2; box-shadow: 0 4px 10px rgba(0,0,0,.45); background-size: cover; background-position: center; background-repeat: no-repeat; transition: top 120ms ease, left 120ms ease; }

    /* Scoreboard */
    .score { background: #0d1524; border: 2px solid #2a3347; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03); }
    .score-header { padding: 10px 12px; border-bottom: 1px solid #2a3347; font-weight: 600; background: #101a2b; }
    .score-list { list-style:none; margin:0; padding: 8px; max-height: min(80vmin, 560px); overflow:auto; }
    .score-item { display:flex; align-items:center; gap:8px; padding: 6px 8px; border-radius:8px; border:1px solid #22314a; background:#111a2a; margin-bottom: 8px; }
    .score-item .avatar { width:24px; height:24px; flex:0 0 24px; border-radius:50%; background:#1b2741 center/cover no-repeat; border:1px solid #2a3347; color:#cbd5e1; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
    /* Gray out dead players */
    .score-item.gray { opacity:.6; filter: grayscale(0.8); }
    .score-item.gray .avatar { filter: grayscale(1) brightness(0.8); }
    .score-item.gray .score-name, .score-item.gray .score-count { opacity:.75; }
    /* Rank badge for kill ranking */
    .rank-badge { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#0f0f12; }
    .rank-1 { background:linear-gradient(135deg,#facc15,#e3a008); box-shadow:0 0 6px rgba(250,204,21,.6); }
    .rank-2 { background:linear-gradient(135deg,#cbd5e1,#94a3b8); }
    .rank-3 { background:linear-gradient(135deg,#fda4af,#fb7185); }
    .rank-badge span { filter:drop-shadow(0 1px 1px rgba(0,0,0,.4)); }

    /* Chat */
    .chat { background: #0d1524; border: 2px solid #2a3347; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03); display:flex; flex-direction:column; height: min(80vmin, 560px); }
    .chat-header { padding: 10px 12px; border-bottom: 1px solid #2a3347; font-weight: 600; background: #101a2b; }
    .chat-body { flex: 1; overflow: auto; padding: 10px 12px; }
    .chat-msg { font-size: 13px; line-height: 1.5; padding: 6px 8px; background:#111a2a; border:1px solid #22314a; border-radius:6px; margin-bottom: 8px; }
    /* system chat variant (align with draw_game) */
    .chat-msg.chat-msg--system { background:#3b2a12; border-color:#73511d; }

    .back { margin-top: 6px; text-align: center; }
    .back a { color: #9ecbff; text-decoration: none; }
    .back a:hover { text-decoration: underline; }

    /* Start button */
    .btn-start { background:#1d2433; color:#e6e6e6; border:1px solid #2a3347; padding:6px 10px; border-radius:8px; cursor:pointer; }
    .btn-start:hover { filter: brightness(1.08); }

    /* Countdown overlay */
    .countdown-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); z-index: 60; }
    .countdown-box { background: #0f172a; border: 1px solid #24314a; border-radius: 12px; padding: 20px 28px; box-shadow: 0 10px 30px rgba(0,0,0,.5); text-align: center; }
    .countdown-num { font-size: 56px; font-weight: 800; letter-spacing: 2px; }

    /* Cells layer for poison ring */
    .cells-layer { position:absolute; inset:0; pointer-events:none; }
    .cell { position:absolute; box-sizing:border-box; border:1px solid rgba(255,255,255,.04); }
    .cell.cell--warn { animation: blinkWarn 0.3s linear infinite alternate; border-color:#ffcc66aa; background:#ffcc6640; }
    @keyframes blinkWarn { from { background:#ffcc6622; } to { background:#ffcc6699; } }
    .cell.cell--toxic { background:#a00030cc; border-color:#ff3b58; }
    .cell.cell--toxic::after { content:'✕'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#ffd0da; font-weight:800; font-size:0.8em; }

    /* Win overlay (enlarged) */
    .win-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); z-index: 70; }
    .win-box { background: #0f172a; border: 1px solid #24314a; border-radius: 18px; padding: 24px 26px; width: min(92vw, 480px); box-shadow: 0 14px 38px rgba(0,0,0,.55); text-align: center; }
    .win-title { font-size: 28px; font-weight: 800; margin-bottom: 10px; letter-spacing:1px; }
    .win-sub { opacity: .95; margin-bottom: 14px; font-size:16px; }
    .winner-box { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:16px; }
    .winner-avatar { width:80px; height:80px; border-radius:50%; background:#1b2741 center/cover no-repeat; border:3px solid #facc15; box-shadow:0 0 0 3px #facc1522, 0 8px 18px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:#e2e8f0; }
    .winner-name { font-size:20px; font-weight:700; }
    .winner-kills { font-size:14px; opacity:.85; }
    .win-list { text-align:left; background:#0e1527; border:1px solid #22314a; border-radius:12px; padding:12px 14px; max-height: 40vh; overflow:auto; font-size:14px; }
    .win-actions { margin-top: 18px; display:flex; justify-content:center; gap:14px; }
    .win-actions button { background:#1d2433; color:#e6e6e6; border:1px solid #2a3347; padding:10px 20px; border-radius:10px; cursor:pointer; font-size:15px; font-weight:600; }
    .win-actions button:hover { filter: brightness(1.1); }
  </style>
</head>

<body>
  <div class="page">
    <h1 style="margin:0;font-size:20px">devour_game</h1>

    <div class="hud">
      <button id="btnStart" class="btn-start" type="button">開始</button>
      <div id="status" class="tag warn">Connecting...</div>
      <div class="tag">Room: <strong id="roomTag">default</strong></div>
      <div class="tag">WS: <span id="wsUrl">-</span></div>
      <div class="tag">剩餘: <span id="aliveCount">0/0</span></div>
    </div>

    <div class="main-row">
      <aside class="score" aria-label="Scoreboard">
        <div class="score-header">記分榜</div>
        <ul id="scoreList" class="score-list"></ul>
      </aside>

      <div class="stage" id="stage">
        <div class="grid"></div>
        <div id="cellsLayer" class="cells-layer"></div>
        <!-- players injected by JS -->
      </div>

      <aside class="chat" aria-label="Room messages">
        <div class="chat-header">聊天室</div>
        <div class="chat-body" id="chatBody"></div>
      </aside>
    </div>

    <div class="back"><a href="./">← 回首頁</a></div>
  </div>

  <!-- Countdown overlay -->
  <div id="countdownOverlay" class="countdown-overlay" role="dialog" aria-modal="true" aria-label="倒數">
    <div class="countdown-box"><div id="countdownNum" class="countdown-num">5</div></div>
  </div>

  <!-- Victory overlay -->
  <div id="winOverlayDevour" class="win-overlay" role="dialog" aria-modal="true" aria-label="勝利" style="display:none">
    <div class="win-box">
      <div class="win-title">勝利者</div>
      <div class="win-sub">恭喜獲勝！</div>
      <div id="winnerBox" class="winner-box"></div>
      <div class="win-list">
        <!-- Winner list injected by JS -->
      </div>
      <div class="win-actions">
        <button id="btnReplay">再玩一次</button>
      </div>
    </div>
  </div>

  <script src="js/devour_game.js"></script>
</body>

</html>
