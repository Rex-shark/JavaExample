<!doctype html>
<html class="no-js" lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devour_game</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#111">

  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #0f0f12; color: #e6e6e6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
    .hud { display:flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; font-size: 14px; }
    .tag { padding: 4px 8px; border-radius: 6px; background: #1d2433; border: 1px solid #2a3347; }
    .ok { color: #9ae6b4; border-color: #2e6b4f; background: #163725; }
    .warn { color: #fbd38d; border-color: #73511d; background: #3b2a12; }
    .err { color: #feb2b2; border-color: #7b2d2d; background: #3a1616; }

    .main-row { display: grid; grid-template-columns: 300px minmax(360px, 640px) 320px; gap: 18px; align-items: start; width: min(100%, 1200px); margin-inline: auto; }

    /* Stage sizing: fit the center column, avoid overflow overlapping side panels */
    .stage { width: 100%; max-width: 640px; height: min(80vmin, 640px); box-sizing: border-box; background: #0d1524; border: 2px solid #2a3347; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03); position: relative; overflow: hidden; }
    .grid { position:absolute; inset:0; background-image: linear-gradient(#1d243333 1px, transparent 1px), linear-gradient(90deg, #1d243333 1px, transparent 1px); background-size: 40px 40px; }
    .player { position:absolute; top:50%; left:50%; width: 22px; height: 22px; margin-left:-11px; margin-top:-11px; border-radius: 50%; border:2px solid #fff2; box-shadow: 0 4px 10px rgba(0,0,0,.45); transform: translate(0,0); transition: transform 80ms ease-out; background-size: cover; background-position: center; background-repeat: no-repeat; }

    /* Scoreboard */
    .score { background: #0d1524; border: 2px solid #2a3347; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03); }
    .score-header { padding: 10px 12px; border-bottom: 1px solid #2a3347; font-weight: 600; background: #101a2b; }
    .score-list { list-style:none; margin:0; padding: 8px; max-height: min(80vmin, 560px); overflow:auto; }
    .score-item { display:flex; align-items:center; gap:8px; padding: 6px 8px; border-radius:8px; border:1px solid #22314a; background:#111a2a; margin-bottom: 8px; }
    .score-item.gray { opacity:.5; }
    .score-rank { width: 22px; text-align:center; opacity:.8; }
    .score-name { flex:1; }
    .score-count { font-weight:700; }

    /* Chat */
    .chat { background: #0d1524; border: 2px solid #2a3347; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03); display:flex; flex-direction:column; height: min(80vmin, 560px); }
    .chat-header { padding: 10px 12px; border-bottom: 1px solid #2a3347; font-weight: 600; background: #101a2b; }
    .chat-body { flex: 1; overflow: auto; padding: 10px 12px; }
    .chat-msg { font-size: 13px; line-height: 1.5; padding: 6px 8px; background:#111a2a; border:1px solid #22314a; border-radius:6px; margin-bottom: 8px; }

    .back { margin-top: 6px; text-align: center; }
    .back a { color: #9ecbff; text-decoration: none; }
    .back a:hover { text-decoration: underline; }

    /* Start button */
    .btn-start { background:#1d2433; color:#e6e6e6; border:1px solid #2a3347; padding:6px 10px; border-radius:8px; cursor:pointer; }
    .btn-start:hover { filter: brightness(1.08); }

    /* Countdown overlay */
    .countdown-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); z-index: 60; }
    .countdown-box { background: #0f172a; border: 1px solid #24314a; border-radius: 12px; padding: 20px 28px; box-shadow: 0 10px 30px rgba(0,0,0,.5); text-align: center; }
    .countdown-num { font-size: 56px; font-weight: 800; letter-spacing: 2px; }
  </style>
</head>

<body>
  <div class="page">
    <h1 style="margin:0;font-size:20px">devour_game</h1>

    <div class="hud">
      <button id="btnStart" class="btn-start" type="button">開始</button>
      <div id="status" class="tag warn">Connecting...</div>
      <div class="tag">Room: <strong id="roomTag">default</strong></div>
      <div class="tag">WS: <span id="wsUrl">-</span></div>
    </div>

    <div class="main-row">
      <aside class="score" aria-label="Scoreboard">
        <div class="score-header">記分榜</div>
        <ul id="scoreList" class="score-list"></ul>
      </aside>

      <div class="stage" id="stage">
        <div class="grid"></div>
        <!-- players injected by JS -->
      </div>

      <aside class="chat" aria-label="Room messages">
        <div class="chat-header">聊天室</div>
        <div class="chat-body" id="chatBody"></div>
      </aside>
    </div>

    <div class="back"><a href="./">← 回首頁</a></div>
  </div>

  <!-- Countdown overlay -->
  <div id="countdownOverlay" class="countdown-overlay" role="dialog" aria-modal="true" aria-label="倒數">
    <div class="countdown-box"><div id="countdownNum" class="countdown-num">5</div></div>
  </div>

  <script src="js/devour_game.js"></script>
</body>

</html>
