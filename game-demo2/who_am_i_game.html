<!doctype html>
<html class="no-js" lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>who_am_i_game</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#111">
  <style>
    html, body { height:100%; margin:0; padding:0; background:#0f0f12; color:#e6e6e6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, Helvetica Neue, Arial; }
    .page { min-height:100vh; display:flex; flex-direction:column; gap:14px; align-items:center; padding:16px; }
    h1 { margin:0; font-size:20px; }
    .hud { width:min(100%,1200px); display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:14px; }
    .hud-group { display:flex; gap:8px; align-items:center; }
    .tag { padding:4px 8px; border-radius:6px; background:#1d2433; border:1px solid #2a3347; }
    .ok { color:#9ae6b4; border-color:#2e6b4f; background:#163725; }
    .warn { color:#fbd38d; border-color:#73511d; background:#3b2a12; }
    .err { color:#feb2b2; border-color:#7b2d2d; background:#3a1616; }
    button, .btn { background:#1d2433; color:#e6e6e6; border:1px solid #2a3347; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
    button:hover, .btn:hover { filter:brightness(1.08); }
    input[type="text"], input[type="number"] { background:#101a2b; color:#e6e6e6; border:1px solid #2a3347; padding:6px 8px; border-radius:6px; width:80px; }

    .layout { width:min(100%,1200px); display:grid; grid-template-columns: minmax(360px, 640px) 320px; gap:18px; align-items:start; margin-inline:auto; padding-left:72px; box-sizing:border-box; }

    .image-wrap { position:relative; background:#0d1524; border:2px solid #2a3347; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03); padding:8px 10px; display:flex; flex-direction:column; gap:10px; }
    .info-panel { display:flex; flex-direction:column; gap:8px; padding:8px 10px; background:#101a2b; border:1px solid #2a3347; border-radius:8px; font-size:13px; }
    .info-row { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
    .info-label { opacity:.9; }
    .stars { color:#facc15; letter-spacing:2px; font-size:18px; }
    .prompt-box { background:#1d2433; border:1px solid #2a3347; padding:6px 12px; border-radius:20px; font-size:16px; font-weight:600; min-height:28px; display:flex; align-items:center; }

    .question-stage { position:relative; width:100%; aspect-ratio:1/1; background:#0c1422; border:1px solid #2a3347; border-radius:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .question-stage img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
    .stage-hint { position:absolute; bottom:6px; right:8px; font-size:12px; opacity:.6; }
    .stage-answer { position:absolute; bottom:6px; left:8px; font-size:14px; font-weight:700; background:#121e33; border:1px solid #24314a; padding:4px 8px; border-radius:8px; color:#facc15; display:none; }

    /* Chat */
    .chat { background:#0d1524; border:2px solid #2a3347; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35) inset, 0 0 0 1px rgba(255,255,255,.03); display:flex; flex-direction:column; height:min(80vmin,640px); }
    .chat-header { padding:10px 12px; border-bottom:1px solid #2a3347; font-weight:600; background:#101a2b; }
    .chat-body { flex:1; overflow:auto; padding:10px 12px; }
    .chat-msg { font-size:13px; line-height:1.5; padding:6px 8px; background:#111a2a; border:1px solid #22314a; border-radius:6px; margin-bottom:8px; }
    .chat-msg.chat-msg--system { background:#3b2a12; border-color:#73511d; }
    .chat-msg.chat-msg--correct { background:#163725; border-color:#2e6b4f; }
    .chat-msg.chat-msg--wrong { background:#3a1616; border-color:#7b2d2d; }

    .back { margin-top:4px; text-align:center; }
    .back a { color:#9ecbff; text-decoration:none; }
    .back a:hover { text-decoration:underline; }

    /* Win overlay */
    .win-overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); z-index:90; }
    .win-box { background:#0f172a; border:1px solid #24314a; border-radius:16px; padding:22px 24px; width:min(92vw,540px); box-shadow:0 14px 38px rgba(0,0,0,.55); }
    .win-title { font-size:24px; font-weight:700; margin:0 0 6px; letter-spacing:1px; text-align:center; }
    .win-sub { opacity:.92; text-align:center; margin-bottom:14px; }
    .answer-preview { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:16px; }
    .answer-preview img { max-width:100%; max-height:260px; border-radius:12px; border:1px solid #24314a; background:#0d1524; }
    .answer-name { font-size:18px; font-weight:600; letter-spacing:1px; color:#facc15; }
    .rank-list { display:flex; flex-direction:column; gap:10px; max-height:40vh; overflow:auto; }
    .rank-item { display:flex; align-items:center; gap:10px; background:#0e1527; border:1px solid #22314a; border-radius:10px; padding:8px 10px; }
    .rank-item .avatar { width:36px; height:36px; border-radius:50%; background:#1b2741 center/cover no-repeat; border:1px solid #2a3347; color:#cbd5e1; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .rank-meta { display:flex; flex-direction:column; gap:2px; }
    .rank-name { font-weight:600; }
    .rank-time { font-size:12px; opacity:.85; }
    .rank-score { font-size:12px; opacity:.85; }
    .win-actions { margin-top:18px; display:flex; justify-content:center; gap:14px; }
    .win-actions button { background:#1d2433; color:#e6e6e6; border:1px solid #2a3347; padding:10px 20px; border-radius:10px; cursor:pointer; font-size:15px; font-weight:600; }
    .win-actions button:hover { filter:brightness(1.1); }

    @media (max-width:1100px){ .layout { grid-template-columns:1fr; padding-left:36px; } .chat { height:380px; } }
  </style>
</head>
<body>
  <div class="page">
    <h1>who_am_i_game</h1>
    <div class="hud">
      <div class="hud-group">
        <button id="btnStart" type="button">開始</button>
        <label>題號 <input id="inputTopicId" type="text" placeholder="1" value="1" /></label>
        <button id="btnExtend" type="button">延長+15秒</button>
      </div>
      <div class="hud-group">
        <div id="status" class="tag warn">Connecting...</div>
        <div class="tag">Room: <strong id="roomTag">default</strong></div>
        <div class="tag">WS: <span id="wsUrl">-</span></div>
        <div class="tag">倒數: <span id="countdown" class="timer">--</span></div>
      </div>
    </div>

    <div class="layout">
      <div class="image-wrap">
        <div class="info-panel">
          <div class="info-row">
            <span class="info-label">難度:</span>
            <span id="levelStars" class="stars">-</span>
            <span class="info-label">提示詞:</span>
            <div id="promptCurrent" class="prompt-box">--</div>
          </div>
        </div>
        <div class="question-stage">
          <img id="questionImg" alt="題目" />
          <div id="stageHint" class="stage-hint"></div>
          <div id="stageAnswerName" class="stage-answer" aria-live="polite" style="display:none"></div>
        </div>
      </div>

      <aside class="chat" aria-label="聊天室">
        <div class="chat-header">聊天室</div>
        <div id="chatBody" class="chat-body"></div>
      </aside>
    </div>

    <div class="back"><a href="./">← 回首頁</a></div>
  </div>

  <div id="winOverlayWho" class="win-overlay" role="dialog" aria-modal="true" aria-label="結果" style="display:none">
    <div class="win-box">
      <div class="win-title">結果</div>
      <div class="win-sub">排名資訊</div>
      <div id="answerPreview" class="answer-preview" style="display:none">
        <img id="answerImg" alt="答案" />
        <div id="answerName" class="answer-name"></div>
      </div>
      <div id="rankList" class="rank-list"></div>
      <div class="win-actions"><button id="btnCloseWin" type="button">關閉</button><button id="btnReplay" type="button">再玩一次</button></div>
    </div>
  </div>

  <script src="js/who_am_i_game.js"></script>
</body>
</html>
