<!doctype html>
<html class="no-js" lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2025尾牙遊戲</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="2025尾牙遊戲">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#111">

  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #0f0f12; color: #e6e6e6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    .page { min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; }
    h1 { font-size: 28px; margin: 0; letter-spacing: 1px; }
    p.sub { opacity:.8; margin: 0 0 8px 0; }
    .cards { display:flex; flex-direction:column; gap:12px; align-items:center; }
    a.btn { display:inline-block; padding: 12px 18px; border-radius: 10px; background:#1d2433; color:#e6e6e6; border:1px solid #2a3347; text-decoration:none; font-weight:600; }
    a.btn:hover { filter: brightness(1.1); }
    small.hint { opacity:.7; }
  </style>
</head>

<body>
  <div class="page">
    <h1>2025尾牙遊戲</h1>
    <p class="sub">請選擇要玩的遊戲</p>

    <div class="cards">
      <a id="btn-move" class="btn" href="./fight_move_game.html">移動遊戲（fight_move_game）</a>
      <a id="btn-devour" class="btn" href="./devour_game.html">吞噬遊戲（devour_game）</a>
      <a id="btn-draw" class="btn" href="./draw_game.html">畫圖猜題遊戲（draw_game）</a>
      <a id="btn-who" class="btn" href="./who_am_i_game.html">我是誰（who_am_i_game）</a>
      <small class="hint">按下後進入遊戲頁</small>
    </div>
  </div>

  <script>
    // Preserve current query string (e.g., ?id=..., ?backend=...) when navigating
    (function(){
      function keepQs(id){
        var link = document.getElementById(id);
        if (!link) return;
        var qs = window.location.search || '';
        if (qs && qs !== '?') {
          try {
            var url = new URL(link.getAttribute('href'), window.location.href);
            var targetQs = url.search || '';
            var combined = targetQs ? (targetQs + '&' + qs.slice(1)) : qs;
            url.search = combined;
            link.setAttribute('href', url.pathname + url.search + url.hash);
          } catch (_) {
            link.setAttribute('href', link.getAttribute('href') + qs);
          }
        }
      }
      keepQs('btn-move');
      keepQs('btn-devour');
      keepQs('btn-draw');
      keepQs('btn-who');
    })();
  </script>
</body>

</html>
